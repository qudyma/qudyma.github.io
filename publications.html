		<style>
	#publications-scroll-wrapper {
		max-height: 600px;
		overflow-y: scroll !important;
		scrollbar-gutter: stable;
		border: 1px solid #ddd;
		padding: 15px;
		border-radius: 5px;
		background-color: #555;
		scrollbar-width: thin !important;
		scrollbar-color: #888 #f1f1f1 !important;
	}
	
	#publications-scroll-wrapper::-webkit-scrollbar {
		width: 12px !important;
	}
	
	#publications-scroll-wrapper::-webkit-scrollbar-track {
		background: #f1f1f1 !important;
		border-radius: 5px;
	}
	
	#publications-scroll-wrapper::-webkit-scrollbar-thumb {
		background: #888 !important;
		border-radius: 5px;
		min-height: 40px;
	}
	
	#publications-scroll-wrapper::-webkit-scrollbar-thumb:hover {
		background: #555 !important;
	}

	.search-toggle-container {
		display: flex;
		gap: 15px;
		align-items: center;
		margin-bottom: 15px;
		flex-wrap: wrap;
	}

	.search-input-wrapper {
		flex: 1 1 300px;
		min-width: 300px;
		position: relative;
		display: flex;
		align-items: center;
	}

	#publications-search {
		flex: 1;
		padding: 10px;
		padding-right: 50px;
		font-size: 1em;
		border: 1px solid #ddd;
		border-radius: 5px;
		box-sizing: border-box;
		line-height: normal;
	}

	.search-results-counter {
		position: absolute;
		right: 10px;
		font-size: 0.9em;
		color: #999;
		pointer-events: none;
		white-space: nowrap;
	}

	#publications-search:focus {
		outline: none;
		border-color: #0066cc;
		box-shadow: 0 0 5px rgba(0, 102, 204, 0.3);
	}

	.toggle-button-group {
		position: relative;
		display: inline-flex;
		align-items: center;
		background-color: #e8e8e8;
		border-radius: 25px;
		padding: 3px 2px;
		border: 1px solid #e8e8e8;
		align-self: stretch;
	}

	.toggle-slider {
		position: absolute;
		top: 3px;
		left: 2px;
		height: calc(100% - 6px);
		width: calc(50% - 2px);
		background-color: #0066cc;
		border-radius: 22px;
		transition: transform 0.3s ease;
		z-index: 1;
	}

	.toggle-slider.publications {
		transform: translateX(100%);
	}

	.toggle-button {
		padding: 4px 20px !important;
		font-size: 1em !important;
		border: none !important;
		outline: none !important;
		background-color: transparent !important;
		background-image: none !important;
		cursor: pointer;
		transition: color 0.3s ease;
		box-sizing: border-box !important;
		white-space: nowrap;
		position: relative;
		z-index: 1;
		-webkit-appearance: none;
		-moz-appearance: none;
		appearance: none;
		color: #666;
		box-shadow: none !important;
		line-height: normal !important;
		height: 100%;
		display: flex;
		align-items: center;
	}

	.toggle-button:focus {
		outline: none !important;
		box-shadow: none !important;
		background-color: transparent !important;
	}

	.toggle-button:hover {
		background-color: transparent !important;
		box-shadow: none !important;
	}

	.toggle-button.active {
		color: white;
	}

	.author-filter {
		display: inline-block;
		padding: 8px 15px;
		margin: 0;
		border: 1px solid #ddd;
		border-radius: 5px;
		cursor: pointer;
		font-size: 0.95em;
		transition: all 0.2s ease;
		box-sizing: border-box;
	}

	.author-filter:hover {
		background-color: #9f9a9a;
		border-color: #0066cc;
		box-shadow: 0 0 5px rgba(0, 102, 204, 0.3);
	}

	.author-filter.active {
		background-color: #0066cc;
		color: white;
		border-color: #0066cc;
	}

	.author-filter.active:hover {
		background-color: #0052a3;
	}

	.year-slider-container {
		display: inline-block;
		padding: 7px 15px 7px;
		margin: 0;
		border: 1px solid #ddd;
		border-radius: 5px;
		cursor: pointer;
		font-size: 0.95em;
		transition: all 0.2s ease;
		box-sizing: border-box;
	}

	.year-slider-label {
		font-size: 0.95em;
		margin-right: 5px;
	}

	.year-range-inputs {
		display: flex;
		align-items: center;
		gap: 8px;
	}

	.year-input {
		width: 75px;
		border: 1px solid #ddd;
		border-radius: 3px;
		text-align: center;
		font-size: 0.95em;
		background-color: #555;
		box-sizing: border-box;
	}

	/* Show number input spinners on all browsers */
	.year-input::-webkit-outer-spin-button,
	.year-input::-webkit-inner-spin-button {
		-webkit-appearance: auto;
		opacity: 1;
		height: auto;
		cursor: pointer;
	}

	.year-range-slider {
		display: none;
	}

	.download-json-btn {
		padding: 10px 15px;
		color: inherit;
		border: 1px solid #ddd;
		border-radius: 5px;
		cursor: pointer;
		font-size: 1em;
		transition: all 0.2s ease;
		box-sizing: border-box;
		background-color: transparent;
		line-height: 1;
		vertical-align: middle;
	}

	.download-json-btn:hover {
		border-color: #0066cc;
		box-shadow: 0 0 5px rgba(0, 102, 204, 0.3);
	}

	#publications-download-container {
		display: flex;
		gap: 10px;
		justify-content: flex-end;
		margin-top: 10px;
		flex-wrap: wrap;
		max-width: 100%;
	}

	#publications-download-container .download-json-btn {
		flex: 0 1 auto;
		white-space: nowrap;
	}
</style>
