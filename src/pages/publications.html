<!-- Banner -->
<section id="banner">
	<div class="inner">
		<h2>Publications</h2>
		<p>Our research outputs and scientific contributions</p>
	</div>
</section>

<!-- Wrapper -->
<section id="wrapper">
	<!-- Four -->
	<section id="four" class="wrapper alt style1">
		<div class="inner">
			<h2 class="major">Publications</h2>
			<div class="search-toggle-container" style="align-items: center; gap: 10px;">
				<div class="search-input-wrapper">
					<input type="text" id="publications-search" placeholder="Search by title, authors, keywords...">
					<span class="search-results-counter">0 results</span>
				</div>
				<div id="publications-year-slider" style="display: flex; flex-wrap: wrap; gap: 5px; flex: 0 1 auto;"></div>
				<div class="toggle-button-group">
					<div class="toggle-slider"></div>
					<button class="toggle-button active" data-view="preprints">Preprints</button>
					<button class="toggle-button" data-view="publications">Published</button>
				</div>
			</div>
			<div id="publications-filters-container" style="margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 5px;">
				<div id="publications-filters" style="display: contents;"></div>
			</div>
			<div id="publications-scroll-wrapper">
				<div id="publications-container"></div>
			</div>
			<div id="publications-download-container">
				<button id="download-publications-bib" class="download-json-btn">Download .bib</button>
				<button id="download-publications-json" class="download-json-btn">Download .json</button>
			</div>
		</div>
	</section>
</section>
